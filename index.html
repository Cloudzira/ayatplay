<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1F2A68">
<title>AyatPlay Kids - Petualangan Hafiz Cilik (Juz 28, 29, 30)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri+Quran&family=Scheherazade+New:wght@400;700&family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js" defer></script>
<style>
:root{
  --night:#1F2A68; --night2:#2E3C8F; --ink:#1E2347; --muted:#5B6190;
  --sky:#EAF3FF; --line:#D5E2F7; --paper:#FFFFFF;
  --sun:#FFC93C; --sun-d:#E8A200; --mint:#19B394; --mint-d:#0E8A71;
  --coral:#FF6F61; --coral-d:#D9483B; --grape:#7C5CFF; --grape-d:#5A3DD6;
  --ok:#17A673; --ok-bg:#DDF7EC; --bad:#E5484D; --bad-bg:#FFE4E4;
  --r:20px; --r-sm:14px;
  --f-ui:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-disp:'Baloo 2','Nunito',system-ui,sans-serif;
  --f-ar:'Amiri Quran','Scheherazade New','Noto Naskh Arabic','Traditional Arabic','Geeza Pro','Al Bayan',serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{margin:0;background:var(--sky);color:var(--ink);font-family:var(--f-ui);font-size:16px;line-height:1.5;min-height:100vh;
  padding-bottom:calc(84px + env(safe-area-inset-bottom,0px));-webkit-tap-highlight-color:transparent}
body.in-game{padding-bottom:24px}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
h1,h2,h3,h4{font-family:var(--f-disp);margin:0;line-height:1.15}
.hidden{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
:focus-visible{outline:3px solid var(--grape);outline-offset:2px;border-radius:10px}
.noselect,.btn,.opt,.chip-w,.gcard,.tab{user-select:none;-webkit-user-select:none}

/* ===== Arabic typography (fixed): one rule family, never inherits UI font ===== */
.ar,.ar *{
  font-family:var(--f-ar)!important;direction:rtl;unicode-bidi:isolate;
  letter-spacing:0!important;word-spacing:.1em;text-transform:none;
  font-kerning:normal;font-feature-settings:"kern","liga","calt","mark","mkmk";
  text-rendering:optimizeLegibility;-webkit-font-smoothing:antialiased;
}
.ar{line-height:2.3;padding-block:.25em;overflow:visible}
.ar-xl{font-size:clamp(2rem,6.4vw,3rem)}
.ar-lg{font-size:clamp(1.7rem,5.2vw,2.4rem)}
.ar-md{font-size:clamp(1.45rem,4.4vw,1.9rem)}
.ar-sm{font-size:1.3rem;line-height:2.1}
.userselect{user-select:text;-webkit-user-select:text}

/* ===== layout ===== */
.wrap{max-width:1080px;margin:0 auto;padding:0 16px}
.top{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.92);backdrop-filter:blur(10px);border-bottom:3px solid var(--sun);
  padding:calc(8px + env(safe-area-inset-top,0px)) 0 8px}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{display:flex;align-items:center;gap:10px;text-align:left}
.brand b{font-family:var(--f-disp);font-size:1.3rem;color:var(--night);display:block;line-height:1}
.brand small{color:var(--muted);font-size:.72rem;font-weight:700}
.chips{display:flex;align-items:center;gap:6px}
.chip{display:inline-flex;align-items:center;gap:5px;background:var(--sky);border:2px solid var(--line);border-radius:999px;padding:4px 10px;font-weight:800;font-size:.92rem;white-space:nowrap}
.icon-btn{width:38px;height:38px;border-radius:50%;background:var(--sky);border:2px solid var(--line);display:grid;place-items:center;font-size:1.1rem}
.view{padding-top:18px}
.sec-title{font-size:1.45rem;color:var(--night);margin:26px 0 12px;display:flex;align-items:center;gap:8px}
.muted{color:var(--muted)}
.card{background:var(--paper);border:3px solid var(--line);border-radius:var(--r);padding:18px}

/* ===== buttons (chunky, kid-friendly) ===== */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-family:var(--f-disp);font-weight:700;font-size:1.05rem;
  padding:11px 20px;border-radius:16px;border-bottom:5px solid rgba(0,0,0,.22);transition:transform .08s,filter .15s;min-height:48px}
.btn:hover{filter:brightness(1.05)}
.btn:active{transform:translateY(3px);border-bottom-width:2px}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn-sun{background:var(--sun);color:#3b2b00}
.btn-mint{background:var(--mint);color:#fff}
.btn-grape{background:var(--grape);color:#fff}
.btn-coral{background:var(--coral);color:#fff}
.btn-ghost{background:#fff;color:var(--night);border:2px solid var(--line);border-bottom-width:5px}
.btn-sm{padding:7px 14px;font-size:.92rem;min-height:40px;border-radius:13px}
.btn-block{width:100%}

/* ===== hero ===== */
.hero{position:relative;overflow:hidden;border-radius:28px;color:#fff;padding:24px 22px;
  background:radial-gradient(circle at 85% 20%,#4b5bd6 0,transparent 45%),linear-gradient(160deg,#1F2A68 0%,#2E3C8F 60%,#3C4FB5 100%);
  display:grid;grid-template-columns:1fr auto;gap:18px;align-items:center;border:4px solid #fff;box-shadow:0 10px 30px rgba(31,42,104,.25)}
.hero .stars-bg{position:absolute;inset:0;pointer-events:none;opacity:.85}
.hero h2{font-size:clamp(1.6rem,4.6vw,2.4rem);position:relative}
.hero p{margin:6px 0 0;opacity:.92;position:relative;max-width:46ch}
.goal{margin-top:14px;position:relative;max-width:360px}
.goal-row{display:flex;justify-content:space-between;font-weight:800;font-size:.9rem;margin-bottom:5px}
.bar{height:14px;background:rgba(255,255,255,.22);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--sun),#FFE48A);border-radius:99px;transition:width .6s cubic-bezier(.2,.8,.2,1)}
.bar.dark{background:var(--line)} .bar.dark>i{background:linear-gradient(90deg,var(--mint),#5FE0C3)}
.hero-cta{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px;position:relative}
.mascot-box{position:relative;display:flex;flex-direction:column;align-items:center;gap:8px;max-width:200px}
.mascot{width:128px;height:128px;filter:drop-shadow(0 8px 14px rgba(0,0,0,.3));animation:floaty 3.6s ease-in-out infinite}
.mascot .eye{transform-origin:center;transform-box:fill-box;animation:blink 4.5s infinite}
.mascot.cheer{animation:hop .7s ease}
.bubble{background:#fff;color:var(--ink);border-radius:18px;padding:8px 12px;font-weight:700;font-size:.85rem;text-align:center;position:relative;box-shadow:0 4px 0 rgba(0,0,0,.12)}
.bubble:before{content:"";position:absolute;top:-8px;left:50%;margin-left:-8px;border:8px solid transparent;border-top:0;border-bottom-color:#fff}
@keyframes floaty{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-8px) rotate(2deg)}}
@keyframes hop{0%{transform:translateY(0) scale(1)}40%{transform:translateY(-22px) scale(1.12)}100%{transform:translateY(0) scale(1)}}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}

/* ===== scope picker ===== */
.scope{display:grid;gap:12px}
.pills{display:flex;flex-wrap:wrap;gap:8px}
.pill{padding:9px 16px;border-radius:999px;border:2px solid var(--line);background:#fff;font-weight:800;color:var(--night)}
.pill.on{background:var(--mint);border-color:var(--mint-d);color:#fff}
select.sel{width:100%;padding:12px 14px;border-radius:14px;border:2px solid var(--line);background:#fff;font:inherit;font-weight:700;color:var(--ink)}
.scope-info{font-weight:700;color:var(--muted);font-size:.92rem}

/* ===== game cards ===== */
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px}
.gcard{position:relative;text-align:left;border-radius:22px;padding:14px;border:3px solid var(--bd);background:var(--bg);
  box-shadow:0 6px 0 var(--bd);display:flex;flex-direction:column;gap:6px;min-height:196px;transition:transform .15s,box-shadow .15s}
.gcard:hover{transform:translateY(-3px);box-shadow:0 9px 0 var(--bd)}
.gcard:active{transform:translateY(4px);box-shadow:0 2px 0 var(--bd)}
.gicon{width:54px;height:54px;border-radius:16px;background:#fff;display:grid;place-items:center;font-size:1.9rem;border:3px solid var(--bd)}
.gcard h3{font-size:1.1rem;color:var(--ink)}
.gcard p{margin:0;font-size:.8rem;color:#3a3f6b;font-weight:600;line-height:1.35;flex:1}
.gstars{display:flex;gap:4px;align-items:center}
.gstars i{font-style:normal;font-size:.95rem;filter:grayscale(1) opacity(.45)}
.gstars i.on{filter:none}
.gnum{position:absolute;top:10px;right:12px;font-family:var(--f-disp);font-weight:800;font-size:.95rem;color:var(--bd);opacity:.9}

/* ===== sheet / modal ===== */
.overlay{position:fixed;inset:0;background:rgba(20,26,70,.55);backdrop-filter:blur(3px);z-index:60;display:flex;align-items:flex-end;justify-content:center;padding:0}
.sheet{background:#fff;width:100%;max-width:560px;border-radius:28px 28px 0 0;padding:20px 18px calc(22px + env(safe-area-inset-bottom,0px));max-height:92vh;overflow:auto;animation:up .25s ease-out}
@media(min-width:640px){.overlay{align-items:center;padding:20px}.sheet{border-radius:28px}}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.sheet-head{display:flex;gap:12px;align-items:center;margin-bottom:6px}
.sheet-head .gicon{flex:none}
.lv{display:flex;align-items:center;gap:12px;padding:12px;border-radius:18px;border:3px solid var(--line);margin-top:10px;background:#fff;width:100%;text-align:left}
.lv.locked{opacity:.55;background:#F4F6FC}
.lv-emo{font-size:1.8rem;width:48px;height:48px;border-radius:14px;background:var(--sky);display:grid;place-items:center;flex:none}
.lv b{font-family:var(--f-disp);font-size:1.1rem;display:block;line-height:1.2}
.lv small{color:var(--muted);font-weight:700}
.lv .go{margin-left:auto;font-family:var(--f-disp);font-weight:800;color:var(--mint-d)}

/* ===== game screen ===== */
.ghead{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;margin-bottom:10px}
.ghead h2{font-size:1.15rem;color:var(--night);text-align:center;line-height:1.1}
.ghead small{display:block;text-align:center;color:var(--muted);font-weight:800;font-size:.78rem}
.score{display:inline-flex;gap:5px;align-items:center;background:#FFF4CC;border:2px solid var(--sun);border-radius:999px;padding:4px 12px;font-weight:800}
.prog{display:flex;gap:6px;margin-bottom:12px}
.prog i{flex:1;height:10px;border-radius:99px;background:var(--line)}
.prog i.done{background:var(--mint)} .prog i.miss{background:var(--coral)} .prog i.now{background:var(--sun)}
.timer{height:10px;background:var(--line);border-radius:99px;overflow:hidden;margin-bottom:12px}
.timer>i{display:block;height:100%;width:100%;background:linear-gradient(90deg,var(--coral),var(--sun));border-radius:99px}
.stage{background:#fff;border:4px solid var(--sun);border-radius:26px;padding:20px 16px;box-shadow:0 10px 28px rgba(31,42,104,.12);display:grid;gap:16px}
.q-text{text-align:center;font-weight:800;color:var(--ink);font-size:1.05rem}
.hint{text-align:center;color:var(--muted);font-weight:700;font-size:.88rem}
.tag{display:inline-block;background:#E7F8F3;color:var(--mint-d);font-weight:800;border-radius:99px;padding:3px 14px;font-size:.85rem}

/* mushaf card — the memorable element */
.mushaf{position:relative;background:linear-gradient(#fff,#fffdf6);border:3px solid #E9C76B;border-radius:22px;padding:12px 16px;
  box-shadow:inset 0 0 0 5px #fff,inset 0 0 0 7px #F3DFA2;text-align:center;color:#12313a;max-width:720px;margin:0 auto;width:100%}
.mushaf.blur .ar{filter:blur(9px)}
.mushaf .badge-n{position:absolute;top:-14px;left:50%;transform:translateX(-50%);background:var(--night);color:#fff;font-family:var(--f-disp);font-weight:700;font-size:.78rem;border-radius:99px;padding:2px 12px;white-space:nowrap}
.words{display:flex;flex-wrap:wrap;justify-content:center;gap:2px 10px;direction:rtl}

.opts{display:grid;gap:12px;max-width:720px;margin:0 auto;width:100%}
.opts.c3{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.opt{display:flex;flex-direction:column;gap:2px;align-items:center;justify-content:center;text-align:center;padding:12px 14px;border-radius:18px;
  background:#EEF4FF;border:3px solid #CFE0FF;border-bottom-width:6px;font-weight:800;font-size:1.05rem;min-height:60px;transition:transform .08s}
.opt:active{transform:translateY(3px);border-bottom-width:3px}
.opt.txt{font-weight:700;font-size:.98rem;line-height:1.4}
.opt.ok{background:var(--ok-bg);border-color:var(--ok);color:#0B5C40}
.opt.bad{background:var(--bad-bg);border-color:var(--bad);color:#8A1F23}
.opt.dim{opacity:.55}
.opt .opt-ar{font-size:1.3rem}
.chip-w{display:inline-flex;align-items:center;justify-content:center;min-width:54px;padding:2px 14px;border-radius:16px;background:#F0EBFF;border:3px solid #D5C9FF;border-bottom-width:6px;color:#2A1B6B;font-size:1.6rem;line-height:2}
.chip-w:active{transform:translateY(3px)}
.chip-w.used{opacity:.25;pointer-events:none}
.tray{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;direction:rtl}
.slotrow{min-height:76px;border:3px dashed #E9C76B;border-radius:20px;padding:10px;background:#FFFBEA;display:flex;flex-wrap:wrap;gap:8px 10px;justify-content:center;align-items:center;direction:rtl}
.slot{display:inline-flex;align-items:center;justify-content:center;min-width:64px;min-height:56px;padding:0 12px;border-radius:14px;border:3px dashed var(--sun-d);background:#FFF3C4;color:#7a5200;font-size:1.5rem;line-height:1.9}
.slot.fill{border-style:solid;background:#fff;color:#12313a}
.slot.ok{border-color:var(--ok);background:var(--ok-bg)} .slot.bad{border-color:var(--bad);background:var(--bad-bg)}
.seq-item{display:flex;align-items:center;gap:10px;width:100%;padding:8px 12px;border-radius:16px;background:#F4EFFF;border:3px solid #D5C9FF;border-bottom-width:6px;text-align:center}
.seq-item .ar{flex:1}
.seq-item.used{opacity:.25;pointer-events:none}
.seq-n{flex:none;background:var(--night);color:#fff;border-radius:50%;width:28px;height:28px;display:grid;place-items:center;font-family:var(--f-disp);font-weight:700;font-size:.9rem}
.seq-item.ok{border-color:var(--ok);background:var(--ok-bg)} .seq-item.bad{border-color:var(--bad);background:var(--bad-bg)}
.listen{display:inline-flex;align-items:center;gap:8px;margin:0 auto}
.mic{width:96px;height:96px;border-radius:50%;background:var(--coral);color:#fff;font-size:2.2rem;display:grid;place-items:center;margin:0 auto;border:5px solid #fff;box-shadow:0 8px 0 var(--coral-d),0 14px 24px rgba(0,0,0,.2)}
.mic.rec{animation:pulse 1s infinite;background:var(--mint);box-shadow:0 8px 0 var(--mint-d)}
@keyframes pulse{50%{transform:scale(1.08)}}

/* memory cards */
.mgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:640px;margin:0 auto;width:100%}
@media(min-width:620px){.mgrid.n8,.mgrid.n12{grid-template-columns:repeat(4,1fr)}}
.mcard{perspective:700px;height:132px;min-width:0}
.mcard .in{display:block}
.mgrid.n8{grid-template-columns:repeat(2,1fr)}
.mgrid.n12{grid-template-columns:repeat(3,1fr)}
.chip-w.ok{background:var(--ok-bg);border-color:var(--ok)}
.chip-w.bad{background:var(--bad-bg);border-color:var(--bad)}
.mcard .in{position:relative;width:100%;height:100%;transition:transform .45s;transform-style:preserve-3d}
.mcard.up .in{transform:rotateY(180deg)}
.mcard .f,.mcard .b{position:absolute;inset:0;border-radius:16px;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:grid;place-items:center;padding:6px;text-align:center;overflow:hidden}
.mcard .b{background:repeating-linear-gradient(45deg,var(--mint) 0 10px,#27C4A5 10px 20px);border:3px solid var(--mint-d);border-bottom-width:6px;font-size:2rem}
.mcard .f{transform:rotateY(180deg);background:#fff;border:3px solid var(--sun);font-size:.74rem;font-weight:700;line-height:1.3}
.mcard .f.arf{border-color:#9ADFCD}
.mcard.done .f{background:var(--ok-bg);border-color:var(--ok)}
.mcard .f .ar{font-size:1rem;line-height:1.8;padding:0}

/* fading words */
.ghost{display:inline-block;min-width:44px;height:52px;border-radius:12px;border:3px dashed #B9C3E6;background:#F1F4FC;vertical-align:middle}
.ghost.peek{border:0;background:none;height:auto}

/* feedback */
.fb{border-radius:22px;padding:14px;border:3px solid;display:grid;gap:10px;animation:up .25s ease-out}
.fb.good{background:var(--ok-bg);border-color:var(--ok)}
.fb.oops{background:#FFF4E5;border-color:#F4A340}
.fb h3{font-size:1.25rem}
.fb .vrow{background:#fff;border-radius:16px;padding:8px 12px;border:2px solid rgba(0,0,0,.06);display:grid;gap:2px}
.fb .vrow .meta{display:flex;justify-content:space-between;align-items:center;gap:8px;font-weight:800;font-size:.8rem;color:var(--muted)}
.fb .vrow .tr{font-size:.88rem;color:#3a3f6b;font-weight:600}
.play{display:inline-flex;align-items:center;gap:6px;background:var(--sun);color:#3b2b00;border-radius:12px;padding:4px 12px;font-weight:800;font-size:.85rem;border-bottom:3px solid var(--sun-d)}

/* results */
.result{text-align:center;display:grid;gap:14px;justify-items:center;max-width:460px;margin:0 auto;padding:8px 0}
.big-stars{font-size:3.2rem;letter-spacing:6px}
.big-stars span.off{filter:grayscale(1) opacity(.3)}
.stat-row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.stat{background:#FFF8DD;border:2px solid var(--sun);border-radius:16px;padding:8px 16px;font-weight:800}

/* learn */
.surahs{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.scard{text-align:left;background:#fff;border:3px solid var(--line);border-radius:20px;padding:12px 14px;display:grid;gap:6px;border-bottom-width:6px}
.scard:active{transform:translateY(3px)}
.scard .top2{display:flex;justify-content:space-between;align-items:center;gap:8px}
.scard .no{background:var(--night);color:#fff;border-radius:12px;min-width:36px;height:36px;display:grid;place-items:center;font-family:var(--f-disp);font-weight:800}
.scard b{font-family:var(--f-disp);font-size:1.12rem;line-height:1.1}
.scard small{color:var(--muted);font-weight:700}
.ctrl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:12px 0}
.seg{display:inline-flex;border:2px solid var(--line);border-radius:14px;overflow:hidden;background:#fff}
.seg button{padding:7px 12px;font-weight:800;font-size:.88rem;color:var(--muted)}
.seg button.on{background:var(--night);color:#fff}
.ayat{background:#fff;border:3px solid var(--line);border-radius:22px;padding:12px 14px;margin-bottom:12px;display:grid;gap:6px;transition:border-color .2s,background .2s}
.ayat.now{border-color:var(--sun);background:#FFFBEA;box-shadow:0 0 0 4px rgba(255,201,60,.35)}
.ayat.mem{border-color:#9ADFCD}
.ayat-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.ayat-top .no{white-space:nowrap;background:var(--night);color:#fff;border-radius:99px;padding:1px 12px;font-family:var(--f-disp);font-weight:700;font-size:.85rem}
.ayat .tr{color:#3a3f6b;font-size:.92rem;font-weight:600;text-align:center}
.ayat.cover .cov{filter:blur(10px);cursor:pointer}
.tick{display:inline-flex;align-items:center;gap:6px;font-weight:800;font-size:.85rem;padding:5px 12px;border-radius:99px;border:2px solid var(--line);background:#fff}
.tick.on{background:var(--ok-bg);border-color:var(--ok);color:#0B5C40}

/* badges, profile */
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.badge{background:#fff;border:3px solid var(--line);border-radius:20px;padding:14px 10px;text-align:center;display:grid;gap:4px;justify-items:center}
.badge .e{font-size:2.4rem;width:62px;height:62px;display:grid;place-items:center;border-radius:50%;background:#FFF4CC;border:3px solid var(--sun)}
.badge.lock{opacity:.6} .badge.lock .e{filter:grayscale(1);background:#EEF1F8;border-color:var(--line)}
.badge b{font-family:var(--f-disp);font-size:1rem;line-height:1.1} .badge small{color:var(--muted);font-weight:700;font-size:.76rem;line-height:1.25}
.field{display:grid;gap:6px}
.field input{padding:12px 14px;border-radius:14px;border:2px solid var(--line);font:inherit;font-weight:800;font-size:1.1rem;color:var(--night)}
.ring{--p:0;width:112px;height:112px;border-radius:50%;background:conic-gradient(var(--mint) calc(var(--p)*1%),var(--line) 0);display:grid;place-items:center;flex:none}
.ring>div{width:84px;height:84px;border-radius:50%;background:#fff;display:grid;place-items:center;font-family:var(--f-disp);font-weight:800;font-size:1.3rem;color:var(--night);text-align:center;line-height:1}
.ring small{display:block;font-size:.65rem;color:var(--muted);font-family:var(--f-ui);font-weight:800;margin-top:2px}
.row{display:flex;gap:14px;align-items:center;flex-wrap:wrap}

/* bottom nav */
.bottom{position:fixed;left:0;right:0;bottom:0;z-index:40;background:#fff;border-top:3px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
.bottom .in{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.tab{display:grid;justify-items:center;gap:0;padding:6px 4px;border-radius:16px;color:var(--muted);font-weight:800;font-size:.72rem}
.tab span{font-size:1.5rem;line-height:1.3;filter:grayscale(.7)}
.tab.on{background:#EEF6FF;color:var(--night)} .tab.on span{filter:none}
body.in-game .bottom{display:none}

.toast-box{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom,0px));z-index:90;display:grid;gap:8px;width:min(92vw,420px);pointer-events:none}
.toast{background:var(--night);color:#fff;border-radius:16px;padding:10px 14px;font-weight:700;box-shadow:0 8px 24px rgba(0,0,0,.25);animation:up .25s ease-out;display:flex;gap:10px;align-items:center}
.toast.gold{background:linear-gradient(90deg,#B77900,#E8A200);}

/* certificate */
.cert-wrap{max-width:720px}
.cert{background:#fff;border:10px double #E9C76B;border-radius:18px;padding:22px 18px;text-align:center;display:grid;gap:8px;position:relative}
.cert h3{font-size:1.8rem;color:var(--night)}
.cert .nm{font-family:var(--f-disp);font-weight:800;font-size:2rem;color:var(--mint-d);border-bottom:3px solid var(--sun);display:inline-block;padding:0 18px;justify-self:center}
.cert .ar{font-size:1.7rem}
@media print{
  @page{size:landscape;margin:10mm}
  body *{visibility:hidden}
  #cert,#cert *{visibility:visible}
  #cert{position:fixed;inset:0;margin:auto;height:max-content;width:90%;border-width:14px}
}
@media(max-width:560px){
  .hero{grid-template-columns:1fr;text-align:left}
  .mascot-box{flex-direction:row;max-width:none;align-items:center}
  .mascot{width:84px;height:84px;flex:none}
  .bubble:before{top:50%;left:-8px;margin:-8px 0 0;border:8px solid transparent;border-left:0;border-right-color:#fff}
  .brand small{display:none}
  .chip{padding:3px 8px;font-size:.85rem}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}html{scroll-behavior:auto}}

["وَإِنَّهُ عَلَىٰ ذَٰلِكَ لَشَهِيدٌ","dan sesungguhnya dia (manusia) menyaksikan (sendiri) keingkarannya,"],
["وَإِنَّهُ لِحُبِّ الْخَيْرِ لَشَدِيدٌ","dan sesungguhnya cintanya kepada harta benar-benar berlebihan."],
["أَفَلَا يَعْلَمُ إِذَا بُعْثِرَ مَا فِي الْقُبُورِ","Maka tidakkah dia mengetahui apabila apa yang di dalam kubur dikeluarkan,"],
["وَحُصِّلَ مَا فِي الصُّدُورِ","dan apa yang tersimpan di dalam dada dilahirkan?"],
["إِنَّ رَبَّهُم بِهِمْ يَوْمَئِذٍ لَّخَبِيرٌ","Sungguh, Tuhan mereka pada hari itu Mahateliti terhadap keadaan mereka."]]},
{no:99,name:"Az-Zalzalah",ar:"الزلزلة",mean:"Guncangan",juz:30,v:[
["إِذَا زُلْزِلَتِ الْأَرْضُ زِلْزَالَهَا","Apabila bumi digoncangkan dengan goncangan yang dahsyat,"],
["وَأَخْرَجَتِ الْأَرْضُ أَثْقَالَهَا","dan bumi telah mengeluarkan beban-beban berat (yang dikandung)nya,"],
["وَقَالَ الْإِنسَانُ مَا لَهَا","dan manusia bertanya, “Apa yang terjadi pada bumi ini?”"],
["يَوْمَئِذٍ تُحَدِّثُ أَخْبَارَهَا","pada hari itu bumi menyampaikan beritanya,"],
["بِأَنَّ رَبَّكَ أَوْحَىٰ لَهَا","karena sesungguhnya Tuhanmu telah memerintahkan (yang demikian itu) kepadanya."],
["يَوْمَئِذٍ يَصْدُرُ النَّاسُ أَشْتَاتًا لِّيُرَوْا أَعْمَالَهُمْ","Pada hari itu manusia keluar dari kuburnya dalam keadaan berkelompok-kelompok, untuk diperlihatkan kepada mereka (balasan) segala perbuatannya."],
["فَمَن يَعْمَلْ مِثْقَالَ ذَرَّةٍ خَيْرًا يَرَهُ","Maka barang siapa mengerjakan kebaikan seberat zarrah, niscaya dia akan melihat (balasan)nya."],
["وَمَن يَعْمَلْ مِثْقَالَ ذَرَّةٍ شَرًّا يَرَهُ","Dan barang siapa mengerjakan kejahatan seberat zarrah, niscaya dia akan melihat (balasan)nya pula."]]},
{no:97,name:"Al-Qadr",ar:"القدر",mean:"Kemuliaan",juz:30,v:[
["إِنَّا أَنزَلْنَاهُ فِي لَيْلَةِ الْقَدْرِ","Sesungguhnya Kami telah menurunkannya (Al-Qur'an) pada malam qadar."],
["وَمَا أَدْرَاكَ مَا لَيْلَةُ الْقَدْرِ","Dan tahukah kamu apakah malam kemuliaan itu?"],
["لَيْلَةُ الْقَدْرِ خَيْرٌ مِّنْ أَلْفِ شَهْرٍ","Malam kemuliaan itu lebih baik daripada seribu bulan."],
["تَنَزَّلُ الْمَلَائِكَةُ وَالرُّوحُ فِيهَا بِإِذْنِ رَبِّهِم مِّن كُلِّ أَمْرٍ","Pada malam itu turun para malaikat dan Rūḥ (Jibril) dengan izin Tuhannya untuk mengatur semua urusan."],
["سَلَامٌ هِيَ حَتَّىٰ مَطْلَعِ الْفَجْرِ","Sejahteralah (malam) itu sampai terbit fajar."]]},
{no:96,name:"Al-Alaq",ar:"العلق",mean:"Segumpal Darah (ayat 1-5)",juz:30,v:[
["اقْرَأْ بِاسْمِ رَبِّكَ الَّذِي خَلَقَ","Bacalah dengan (menyebut) nama Tuhanmu yang menciptakan,"],
["خَلَقَ الْإِنسَانَ مِنْ عَلَقٍ","Dia telah menciptakan manusia dari segumpal darah."],
["اقْرَأْ وَرَبُّكَ الْأَكْرَمُ","Bacalah, dan Tuhanmulah Yang Mahamulia,"],
["الَّذِي عَلَّمَ بِالْقَلَمِ","yang mengajar (manusia) dengan pena."],
["عَلَّمَ الْإِنسَانَ مَا لَمْ يَعْلَمْ","Dia mengajarkan manusia apa yang tidak diketahuinya."]]},
{no:95,name:"At-Tin",ar:"التين",mean:"Buah Tin",juz:30,v:[
["وَالتِّينِ وَالزَّيْتُونِ","Demi (buah) Tin dan (buah) Zaitun,"],
["وَطُورِ سِينِينَ","demi gunung Sinai,"],
["وَهَٰذَا الْبَلَدِ الْأَمِينِ","dan demi negeri (Mekah) yang aman ini."],
["لَقَدْ خَلَقْنَا الْإِنسَانَ فِي أَحْسَنِ تَقْوِيمٍ","Sungguh, Kami telah menciptakan manusia dalam bentuk yang sebaik-baiknya."],
["ثُمَّ رَدَدْنَاهُ أَسْفَلَ سَافِلِينَ","Kemudian Kami kembalikan dia ke tempat yang serendah-rendahnya (neraka),"],
["إِلَّا الَّذِينَ آمَنُوا وَعَمِلُوا الصَّالِحَاتِ فَلَهُمْ أَجْرٌ غَيْرُ مَمْنُونٍ","kecuali orang-orang yang beriman dan mengerjakan kebajikan; maka mereka akan mendapat pahala yang tidak ada putus-putusnya."],
["فَمَا يُكَذِّبُكَ بَعْدُ بِالدِّينِ","Maka apa yang menyebabkan engkau (orang kafir) mendustakan hari pembalasan setelah (adanya keterangan) itu?"],
["أَلَيْسَ اللَّهُ بِأَحْكَمِ الْحَاكِمِينَ","Bukankah Allah hakim yang paling adil?"]]},
{no:94,name:"Al-Insyirah",ar:"الشرح",mean:"Kelapangan",juz:30,v:[
["أَلَمْ نَشْرَحْ لَكَ صَدْرَكَ","Bukankah Kami telah melapangkan dadamu (Muhammad)?"],
["وَوَضَعْنَا عَنكَ وِزْرَكَ","dan Kami pun telah menurunkan bebanmu darimu,"],
["الَّذِي أَنقَضَ ظَهْرَكَ","yang memberatkan punggungmu?"],
["وَرَفَعْنَا لَكَ ذِكْرَكَ","Dan Kami tinggikan sebutan (nama)mu bagimu."],
["فَإِنَّ مَعَ الْعُسْرِ يُسْرًا","Maka sesungguhnya beserta kesulitan ada kemudahan,"],
["إِنَّ مَعَ الْعُسْرِ يُسْرًا","sesungguhnya beserta kesulitan ada kemudahan."],
["فَإِذَا فَرَغْتَ فَانصَبْ","Maka apabila engkau telah selesai (dari sesuatu urusan), tetaplah bekerja keras (untuk urusan yang lain),"],
["وَإِلَىٰ رَبِّكَ فَارْغَب","dan hanya kepada Tuhanmulah engkau berharap."]]},
{no:93,name:"Ad-Duha",ar:"الضحى",mean:"Waktu Duha",juz:30,v:[
["وَالضُّحَىٰ","Demi waktu duha (ketika matahari naik sepenggalah),"],
["وَاللَّيْلِ إِذَا سَجَىٰ","demi malam apabila telah sunyi,"],
["مَا وَدَّعَكَ رَبُّكَ وَمَا قَلَىٰ","Tuhanmu tidak meninggalkan engkau (Muhammad) dan tidak (pula) membencimu,"],
["وَلَلْآخِرَةُ خَيْرٌ لَّكَ مِنَ الْأُولَىٰ","dan sungguh, yang kemudian itu lebih baik bagimu daripada yang permulaan."],
["وَلَسَوْفَ يُعْطِيكَ رَبُّكَ فَتَرْضَىٰ","Dan sungguh, kelak Tuhanmu pasti memberikan karunia-Nya kepadamu sehingga engkau menjadi puas."],
["أَلَمْ يَجِدْكَ يَتِيمًا فَآوَىٰ","Bukankah Dia mendapatimu sebagai seorang yatim, lalu Dia melindungimu?"],
["وَوَجَدَكَ ضَالًّا فَهَدَىٰ","Dan Dia mendapatimu sebagai seorang yang bingung, lalu Dia memberikan petunjuk,"],
["وَوَجَدَكَ عَائِلًا فَأَغْنَىٰ","dan Dia mendapatimu sebagai seorang yang kekurangan, lalu Dia memberikan kecukupan."],
["فَأَمَّا الْيَتِيمَ فَلَا تَقْهَرْ","Maka terhadap anak yatim janganlah engkau berlaku sewenang-wenang."],
["وَأَمَّا السَّائِلَ فَلَا تَنْهَرْ","Dan terhadap orang yang meminta-minta janganlah engkau menghardik(nya)."],
["وَأَمَّا بِنِعْمَةِ رَبِّكَ فَحَدِّثْ","Dan terhadap nikmat Tuhanmu, hendaklah engkau menyebutnya (dengan bersyukur)."]]},

{no:67,name:"Al-Mulk",ar:"الملك",mean:"Kerajaan (ayat 1-5)",juz:29,v:[
["تَبَارَكَ الَّذِي بِيَدِهِ الْمُلْكُ وَهُوَ عَلَىٰ كُلِّ شَيْءٍ قَدِيرٌ","Mahasuci Allah yang di tangan-Nyalah segala kerajaan, dan Dia Mahakuasa atas segala sesuatu,"],
["الَّذِي خَلَقَ الْمَوْتَ وَالْحَيَاةَ لِيَبْلُوَكُمْ أَيُّكُمْ أَحْسَنُ عَمَلًا ۚ وَهُوَ الْعَزِيزُ الْغَفُورُ","yang menciptakan mati dan hidup, untuk menguji kamu, siapa di antara kamu yang lebih baik amalnya. Dan Dia Mahaperkasa, Maha Pengampun,"],
["الَّذِي خَلَقَ سَبْعَ سَمَاوَاتٍ طِبَاقًا ۖ مَّا تَرَىٰ فِي خَلْقِ الرَّحْمَٰنِ مِن تَفَاوُتٍ ۖ فَارْجِعِ الْبَصَرَ هَلْ تَرَىٰ مِن فُطُورٍ","yang menciptakan tujuh langit berlapis-lapis. Kamu tidak akan melihat sesuatu yang tidak seimbang pada ciptaan Tuhan Yang Maha Pengasih. Maka lihatlah berulang-ulang, adakah kamu melihat sesuatu yang cacat?"],
["ثُمَّ ارْجِعِ الْبَصَرَ كَرَّتَيْنِ يَنقَلِبْ إِلَيْكَ الْبَصَرُ خَاسِئًا وَهُوَ حَسِيرٌ","Kemudian pandanglah sekali lagi, niscaya pandanganmu akan kembali kepadamu dengan tidak menemukan cacat dan ia (pandangan itu) dalam keadaan letih."],
["وَلَقَدْ زَيَّنَّا السَّمَاءَ الدُّنْيَا بِمَصَابِيحَ وَجَعَلْنَاهَا رُجُومًا لِّلشَّيَاطِينِ ۖ وَأَعْتَدْنَا لَهُمْ عَذَابَ السَّعِيرِ","Dan sungguh, Kami telah menghiasi langit yang dekat dengan bintang-bintang dan Kami jadikannya (bintang-bintang itu) sebagai alat-alat pelempar setan, dan Kami sediakan bagi mereka azab neraka yang menyala-nyala."]]},
{no:68,name:"Al-Qalam",ar:"القلم",mean:"Pena (ayat 1-4)",juz:29,v:[
["ن ۚ وَالْقَلَمِ وَمَا يَسْطُرُونَ","Nun. Demi pena dan apa yang mereka tuliskan,"],
["مَا أَنتَ بِنِعْمَةِ رَبِّكَ بِمَجْنُونٍ","berkat nikmat Tuhanmu engkau (Muhammad) bukanlah orang gila."],
["وَإِنَّ لَكَ لَأَجْرًا غَيْرَ مَمْنُونٍ","Dan sungguh, engkau pasti mendapat pahala yang besar yang tidak putus-putusnya."],
["وَإِنَّكَ لَعَلَىٰ خُلُقٍ عَظِيمٍ","Dan sesungguhnya engkau benar-benar berbudi pekerti yang agung."]]},
{no:73,name:"Al-Muzzammil",ar:"المزمل",mean:"Orang Berselimut (ayat 1-4)",juz:29,v:[
["يَا أَيُّهَا الْمُزَّمِّلُ","Wahai orang yang berselimut (Muhammad)!"],
["قُمِ اللَّيْلَ إِلَّا قَلِيلًا","bangunlah (untuk salat) pada malam hari, kecuali sebagian kecil,"],
["نِّصْفَهُ أَوِ انقُصْ مِنْهُ قَلِيلًا","(yaitu) separuhnya atau kurangi sedikit dari seperdua itu,"],
["أَوْ زِدْ عَلَيْهِ وَرَتِّلِ الْقُرْآنَ تَرْتِيلًا","atau lebih dari (seperdua) itu, dan bacalah Al-Qur'an itu dengan perlahan-lahan."]]},
{no:74,name:"Al-Muddatsir",ar:"المدثر",mean:"Orang Berkemul (ayat 1-7)",juz:29,v:[
["يَا أَيُّهَا الْمُدَّثِّرُ","Wahai orang yang berkemul (berselimut)!"],
["قُمْ فَأَنذِرْ","bangunlah, lalu berilah peringatan!"],
["وَرَبَّكَ فَكَبِّرْ","dan agungkanlah Tuhanmu,"],
["وَثِيَابَكَ فَطَهِّرْ","dan bersihkanlah pakaianmu,"],
["وَالرُّجْزَ فَاهْجُرْ","dan tinggalkanlah segala (perbuatan) yang keji,"],
["وَلَا تَمْنُن تَسْتَكْثِرُ","dan janganlah engkau (Muhammad) memberi (dengan maksud) memperoleh (balasan) yang lebih banyak."],
["وَلِرَبِّكَ فَاصْبِرْ","Dan karena Tuhanmu, bersabarlah."]]},

{no:59,name:"Al-Hasyr",ar:"الحشر",mean:"Pengusiran (ayat 22-24)",juz:28,from:22,v:[
["هُوَ اللَّهُ الَّذِي لَا إِلَٰهَ إِلَّا هُوَ ۖ عَالِمُ الْغَيْبِ وَالشَّهَادَةِ ۖ هُوَ الرَّحْمَٰنُ الرَّحِيمُ","Dialah Allah, tidak ada tuhan selain Dia. Yang Mengetahui yang gaib dan yang nyata. Dialah Yang Maha Pengasih, Maha Penyayang."],
["هُوَ اللَّهُ الَّذِي لَا إِلَٰهَ إِلَّا هُوَ الْمَلِكُ الْقُدُّوسُ السَّلَامُ الْمُؤْمِنُ الْمُهَيْمِنُ الْعَزِيزُ الْجَبَّارُ الْمُتَكَبِّرُ ۚ سُبْحَانَ اللَّهِ عَمَّا يُشْرِكُونَ","Dialah Allah, tidak ada tuhan selain Dia. Raja, Yang Mahasuci, Yang Mahasejahtera, Yang Menjaga Keamanan, Pemelihara Keselamatan, Yang Mahaperkasa, Yang Mahakuasa, Yang Memiliki Segala Keagungan. Mahasuci Allah dari apa yang mereka persekutukan."],
["هُوَ اللَّهُ الْخَالِقُ الْبَارِئُ الْمُصَوِّرُ ۖ لَهُ الْأَسْمَاءُ الْحُسْنَىٰ ۚ يُسَبِّحُ لَهُ مَا فِي السَّمَاوَاتِ وَالْأَرْضِ ۖ وَهُوَ الْعَزِيزُ الْحَكِيمُ","Dialah Allah Yang Menciptakan, Yang Mengadakan, Yang Membentuk Rupa, Dia memiliki nama-nama yang indah. Apa yang di langit dan di bumi bertasbih kepada-Nya. Dan Dialah Yang Mahaperkasa, Mahabijaksana."]]},
{no:61,name:"As-Saff",ar:"الصف",mean:"Barisan (ayat 1-3)",juz:28,v:[
["سَبَّحَ لِلَّهِ مَا فِي السَّمَاوَاتِ وَمَا فِي الْأَرْضِ ۖ وَهُوَ الْعَزِيزُ الْحَكِيمُ","Apa yang di langit dan apa yang di bumi bertasbih kepada Allah; dan Dialah Yang Mahaperkasa, Mahabijaksana."],
["يَا أَيُّهَا الَّذِينَ آمَنُوا لِمَ تَقُولُونَ مَا لَا تَفْعَلُونَ","Wahai orang-orang yang beriman! Mengapa kamu mengatakan sesuatu yang tidak kamu kerjakan?"],
["كَبُرَ مَقْتًا عِندَ اللَّهِ أَن تَقُولُوا مَا لَا تَفْعَلُونَ","(Itu) sangatlah dibenci di sisi Allah jika kamu mengatakan apa yang tidak kamu kerjakan."]]},
{no:62,name:"Al-Jumu'ah",ar:"الجمعة",mean:"Hari Jumat (ayat 1-4)",juz:28,v:[
["يُسَبِّحُ لِلَّهِ مَا فِي السَّمَاوَاتِ وَمَا فِي الْأَرْضِ الْمَلِكِ الْقُدُّوسِ الْعَزِيزِ الْحَكِيمِ","Apa yang ada di langit dan apa yang ada di bumi senantiasa bertasbih kepada Allah, Raja, Yang Mahasuci, Yang Mahaperkasa, Mahabijaksana."],
["هُوَ الَّذِي بَعَثَ فِي الْأُمِّيِّينَ رَسُولًا مِّنْهُمْ يَتْلُو عَلَيْهِمْ آيَاتِهِ وَيُزَكِّيهِمْ وَيُعَلِّمُهُمُ الْكِتَابَ وَالْحِكْمَةَ وَإِن كَانُوا مِن قَبْلُ لَفِي ضَلَالٍ مُّبِينٍ","Dialah yang mengutus seorang Rasul kepada kaum yang buta huruf dari kalangan mereka sendiri, yang membacakan ayat-ayat-Nya kepada mereka, menyucikan (jiwa) mereka, dan mengajarkan kepada mereka Kitab dan Hikmah (Sunnah), meskipun sebelumnya mereka benar-benar berada dalam kesesatan yang nyata,"],
["وَآخَرِينَ مِنْهُمْ لَمَّا يَلْحَقُوا بِهِمْ ۚ وَهُوَ الْعَزِيزُ الْحَكِيمُ","dan (juga) kepada kaum yang lain dari mereka yang belum berhubungan dengan mereka. Dan Dialah Yang Mahaperkasa, Mahabijaksana."],
["ذَٰلِكَ فَضْلُ اللَّهِ يُؤْتِيهِ مَن يَشَاءُ ۚ وَاللَّهُ ذُو الْفَضْلِ الْعَظِيمِ","Demikianlah karunia Allah, diberikan-Nya kepada siapa yang Dia kehendaki. Dan Allah memiliki karunia yang besar."]]}

const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rnd=n=>Math.floor(Math.random()*n);
const shuffle=a=>{const b=[...a];for(let i=b.length-1;i>0;i--){const j=rnd(i+1);[b[i],b[j]]=[b[j],b[i]];}return b;};
const pick=a=>a[rnd(a.length)];
const pad=(n,l=3)=>String(n).padStart(l,'0');
const wait=ms=>new Promise(r=>setTimeout(r,ms));

/* ---------- kompilasi data ---------- */
const MARK_ONLY=/^[\u06D6-\u06DC\u06DE\u06E9]+$/;       // tanda waqaf berdiri sendiri
function tokenize(text){
  const out=[];
  text.split(/\s+/).filter(Boolean).forEach(t=>{
    if(MARK_ONLY.test(t)&&out.length) out[out.length-1]+='\u00A0'+t;   // tempelkan ke kata sebelumnya
    else out.push(t);
  });
  return out;
}

let AC=null;
function sfx(type){
  if(!S.sound) return;
  try{
    AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    if(AC.state==='suspended') AC.resume();
    const t=AC.currentTime;
    const tone=(f,start,dur,wave='triangle',vol=.22,to=null)=>{
      const o=AC.createOscillator(),g=AC.createGain(); o.type=wave; o.frequency.setValueAtTime(f,t+start);
      if(to) o.frequency.exponentialRampToValueAtTime(to,t+start+dur);
      g.gain.setValueAtTime(vol,t+start); g.gain.exponentialRampToValueAtTime(.001,t+start+dur);
      o.connect(g);g.connect(AC.destination);o.start(t+start);o.stop(t+start+dur+.02);
    };
    if(type==='correct'){tone(660,0,.14);tone(880,.12,.22);}
    else if(type==='wrong'){tone(260,0,.22,'sine',.2,170);}
    else if(type==='tap'){tone(520,0,.06,'sine',.12);}
    else if(type==='win'){[523,659,784,1046].forEach((f,i)=>tone(f,i*.12,.25));}
    else if(type==='star'){tone(880,0,.18,'sine');tone(1318,.1,.3,'sine');}
  }catch(e){}
}

const QARI='https://everyayah.com/data/Alafasy_128kbps/';
const A=new Audio(); A.preload='auto';
let curRes=null;
A.addEventListener('ended',()=>{if(curRes){const r=curRes;curRes=null;r(true);}});
A.addEventListener('error',()=>{if(curRes){const r=curRes;curRes=null;r(false);}});
function stopAudio(){ try{A.pause();}catch(e){} if(curRes){const r=curRes;curRes=null;r(null);} }
function playOnce(v,rate=1){
  stopAudio();
  return new Promise(res=>{
    curRes=res; A.src=QARI+v.audio; A.playbackRate=rate; A.preservesPitch=true;
    const p=A.play(); if(p&&p.catch) p.catch(()=>{ if(curRes===res){curRes=null;res(false);} });
  });
}

const later=(fn,ms)=>{ const id=setTimeout(fn,ms); if(run) run.tms.push(id); return id; };
function clearGameTimers(){ if(run){ run.tms.forEach(clearTimeout); run.tms=[]; } }
const arSpan=(t,c='ar-md')=>`<span class="ar ${c}" lang="ar" dir="rtl">${t}</span>`;
const mushaf=(inner,o={})=>`<div class="mushaf ${o.blur?'blur':''}">${o.badge?`<span class="badge-n">${esc(o.badge)}</span>`:''}<div class="ar ar-xl" lang="ar" dir="rtl">${inner}</div></div>`;

/* ---------- pengambil materi ---------- */
function pickV(filter=()=>true){
  let list=scopePool().filter(filter);
  if(!list.length) list=VERSES.filter(filter);
  if(!list.length) list=VERSES;
  let fresh=list.filter(v=>!run.used.has(v.key)); if(!fresh.length) fresh=list;
  const v=pick(fresh); run.used.add(v.key); return v;
}
function others(v,f=()=>true){
  return {same:SURAHS[v.s].verses.filter(x=>x.key!==v.key&&f(x)),scope:scopePool().filter(x=>x.key!==v.key&&f(x)),all:VERSES.filter(x=>x.key!==v.key&&f(x))};
}
function distract(correctKey,n,groups,keyFn){
  const seen=new Set([correctKey]),out=[];
  for(const g of groups) for(const c of shuffle(g)){
    if(out.length>=n) return out;
    const k=keyFn(c); if(!seen.has(k)){seen.add(k);out.push(c);}
  }
  return out;
}
const lev=(a,b)=>{ const m=a.length,n=b.length; if(!m) return n; if(!n) return m; let p=Array.from({length:n+1},(_,i)=>i);
  for(let i=1;i<=m;i++){ const c=[i]; for(let j=1;j<=n;j++) c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1)); p=c; } return p[n]; };
const similarity=(a,b)=>{ a=normAr(a).replace(/\s/g,''); b=normAr(b).replace(/\s/g,''); const L=Math.max(a.length,b.length); return L?1-lev(a,b)/L:0; };

const vrow=v=>`<div class="vrow"><div class="meta"><span>${esc(v.sName)} · ayat ${v.n}</span><button class="play" data-act="gplay" data-key="${v.key}">🔊 Dengar</button></div>

const OPTS=(arr)=>arr.map(o=>`<button class="opt ${o.cls||''}" data-act="opt" data-ok="${o.ok?1:0}">${o.html}</button>`).join('');

/* 1. Tebak Surah */
function r1(el,cfg,l){
  const v=pickV(), t=SURAHS[v.s];
  const pool=[...new Set(scopePool().map(x=>x.s))].map(n=>SURAHS[n]);
  const wrong=distract(t.no,cfg.opts-1,[pool,SURAH_LIST],s=>s.no);
  const opts=shuffle([t,...wrong]);
  run.q={v};
  el.innerHTML=`<div class="q-text">Ayat ini ada di surah apa?</div>${mushaf(v.ar)}
    <div style="text-align:center">${listenBtn(v)}</div>
    <div class="opts c3">${OPTS(opts.map(s=>({ok:s.no===t.no,html:`<span>${esc(s.name)}</span><span class="ar opt-ar" lang="ar">${s.ar}</span>`})))}</div>`;
  run.q.wrong=`Jawaban yang benar: Surah ${esc(t.name)}.`;
  if(cfg.timer) startTimer(cfg.timer);
}

/* 2. Sambung Ayat */
function r2(el,cfg,l){
  if(l<=2){
    const f=x=>x.words.length>=2, v=pickV(f), w=v.words, frac=l===1?.6:.4;
    const cutOf=ww=>Math.min(ww.length-1,Math.max(1,Math.round(ww.length*frac)));
    const c=cutOf(w), head=w.slice(0,c).join(' '), tail=w.slice(c).join(' ');
    const o=others(v,f), mk=a=>a.map(x=>({x,t:x.words.slice(cutOf(x.words)).join(' ')}));
    const wrong=distract(tail,cfg.opts-1,l===1?[mk(o.scope),mk(o.all)]:[mk(o.same),mk(o.scope),mk(o.all)],z=>z.t);
    const opts=shuffle([{t:tail,ok:1},...wrong.map(z=>({t:z.t,ok:0}))]);
    run.q={v};
    el.innerHTML=`<div class="q-text">Lanjutkan ayatnya! 🔗</div>${mushaf(`${head} <span style="color:#E8A200">…</span>`,{badge:`${v.sName} · ayat ${v.n}`})}
      <div style="text-align:center">${listenBtn(v)}</div>
      <div class="opts">${OPTS(opts.map(z=>({ok:z.ok,html:arSpan(z.t)})))}</div>`;
  } else {
    const f=x=>!!SURAHS[x.s].verses[x.i+1], v=pickV(f), nx=SURAHS[v.s].verses[v.i+1];
    const same=SURAHS[v.s].verses.filter(x=>x.key!==v.key&&x.key!==nx.key);
    const sc=scopePool().filter(x=>x.key!==v.key), al=VERSES.filter(x=>x.key!==v.key);
    const wrong=distract(nx.ar,cfg.opts-1,[same,sc,al],x=>x.ar);
    const opts=shuffle([{t:nx.ar,ok:1},...wrong.map(x=>({t:x.ar,ok:0}))]);
    run.q={v:[v,nx]};
    el.innerHTML=`<div class="q-text">Ayat apa yang datang SETELAH ayat ini? ➡️</div>${mushaf(v.ar,{badge:`${v.sName} · ayat ${v.n}`})}
      <div style="text-align:center">${listenBtn(v)}</div>
      <div class="opts">${OPTS(opts.map(z=>({ok:z.ok,html:arSpan(z.t)})))}</div>`;
  }
  run.q.wrong='Perhatikan sambungan yang benar di bawah ini ya.';
  if(cfg.timer) startTimer(cfg.timer);
}

/* 3. Urutkan Ayat */
function r3(el,cfg,l){
  const k=[3,4,5][l-1];
  const all=[...new Set(scopePool().map(x=>x.s))].map(n=>SURAHS[n]).filter(s=>s.verses.length>=2);
  let cand=all.filter(s=>s.verses.length>=k); if(!cand.length) cand=all.length?all:SURAH_LIST.filter(s=>s.verses.length>=k);
  const s=pick(cand), kk=Math.min(k,s.verses.length), st=rnd(s.verses.length-kk+1), win=s.verses.slice(st,st+kk);
  let items=shuffle(win),tries=0; while(items.every((v,i)=>v.ar===win[i].ar)&&tries++<12) items=shuffle(win);
  const q=run.q={v:win,sel:[],done:null};
  const draw=()=>{
    el.innerHTML=`<div class="q-text">Urutkan ayat-ayat Surah ${esc(s.name)} dari yang pertama sampai terakhir</div>
      <div class="slotrow" style="flex-direction:column;align-items:stretch;direction:ltr">${q.sel.length?q.sel.map((idx,pos)=>`<button class="seq-item ${q.done?(q.done[pos]?'ok':'bad'):''}" data-act="o3un" data-pos="${pos}" ${q.done?'disabled':''}><span class="seq-n">${pos+1}</span>${arSpan(items[idx].ar)}</button>`).join(''):'<span class="hint">Ketuk ayat di bawah satu per satu sesuai urutannya</span>'}</div>
      <div style="display:grid;gap:10px">${items.map((v,idx)=>`<button class="seq-item ${q.sel.includes(idx)?'used':''}" data-act="o3pick" data-idx="${idx}" ${q.done?'disabled':''}>${arSpan(v.ar)}</button>`).join('')}</div>
      <button class="btn btn-sun btn-block" data-act="o3chk" ${q.sel.length<items.length||q.done?'disabled':''}>Periksa urutan ✔</button>`;
  };
  q.draw=draw; q.items=items; draw();
}

/* 4. Bacakan Ayat */
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
function r4(el,cfg,l){
  const f=l===1?x=>x.words.length<=5:l===2?x=>x.words.length>=3&&x.words.length<=9:x=>x.words.length>=4;
  const v=pickV(f), hide=l===3; run.q={v,att:0};
  el.innerHTML=`<div class="q-text">${hide?'Bacakan ayat ini dari ingatanmu!':'Bacakan ayat ini dengan suara merdu!'}</div>
    <div id="mus">${mushaf(v.ar,{badge:`${v.sName} · ayat ${v.n}`,blur:hide})}</div>
    <div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap">${listenBtn(v)}${hide?'<button class="btn btn-ghost btn-sm" data-act="peek">👀 Intip ayat</button>':''}</div>
    ${SR?`<div><button class="mic" id="mic" data-act="mic" aria-label="Mulai merekam bacaan">🎤</button><div class="hint" id="mic-msg" style="margin-top:10px">Tekan mikrofon, lalu bacakan ayatnya dengan lantang.</div></div>`
        :`<div class="hint">Perangkat ini belum mendukung pengenalan suara, jadi nilai bacaanmu sendiri ya. Baca keras-keras dulu!</div>`}
    <div style="display:grid;gap:10px;max-width:520px;margin:0 auto;width:100%">
      <button class="btn btn-mint btn-block" data-act="selfok">Aku sudah lancar ✅</button>
      <button class="btn btn-ghost btn-block" data-act="selfno">Aku masih belajar 🔁</button></div>`;
}
function startMic(){
  if(!SR||!run||run.locked) return;
  stopAudio(); const q=run.q, mic=$('#mic'), msg=$('#mic-msg'); let got=false,err=false;
  const rec=new SR(); rec.lang='ar-SA'; rec.interimResults=false; rec.maxAlternatives=3;
  mic.classList.add('rec'); msg.textContent='🎙️ Mendengarkan… silakan membaca!';
  rec.onresult=e=>{
    got=true; const alts=[...e.results[0]].map(a=>a.transcript), sim=Math.max(...alts.map(a=>similarity(a,q.v.ar))), pc=Math.round(sim*100); q.att++;
    if(sim>=.5) ans(true,q.v,`Kemiripan bacaanmu ±${pc}%. (Penilaian suara hanya perkiraan.)`);
    else if(q.att>=2) ans(false,q.v,`Kemiripan ±${pc}%. Dengarkan contoh qari lalu coba lagi nanti ya.`);
    else msg.textContent=`Kemiripan ±${pc}%. Coba sekali lagi, pelan-pelan dan jelas ya!`;
  };
  rec.onerror=ev=>{ err=true; msg.textContent=ev.error==='not-allowed'||ev.error==='service-not-allowed'?'Izin mikrofon belum diberikan. Kamu bisa menilai bacaanmu sendiri di bawah.':'Suara belum tertangkap. Coba lagi, atau nilai bacaanmu sendiri.'; };
  rec.onend=()=>{ if(mic) mic.classList.remove('rec'); if(!got&&!err&&!run.locked) msg.textContent='Suaramu belum terdengar. Coba lagi ya.'; };
  try{rec.start();}catch(e){ mic.classList.remove('rec'); }
}

/* 5. Detektif Kata */
function r5(el,cfg,l){
  const nb=l===3?2:1, v=pickV(x=>x.words.length>=(nb===2?3:2)), w=v.words;
  let cand=shuffle(w.map((_,i)=>i)).filter(i=>normAr(w[i]).length>=3); if(cand.length<nb) cand=shuffle(w.map((_,i)=>i));
  const blanks=cand.slice(0,nb).sort((a,b)=>a-b), answers=blanks.map(i=>w[i]);
  const o=others(v), words=a=>a.flatMap(x=>x.words);
  const groups=l===1?[words(o.scope),words(o.all)]:[words(o.same),words(o.scope),words(o.all)];
  const seen=new Set(w.map(normAr)), wrong=[];
  for(const g of groups){ for(const c of shuffle(g)){ if(wrong.length>=cfg.opts-nb) break; const k=normAr(c); if(!seen.has(k)){seen.add(k);wrong.push(c);} } }
  const chips=shuffle([...answers,...wrong]);
  const q=run.q={v,fills:Array(nb).fill(null),done:false};
  const draw=()=>{
    let k=0;
    const line=w.map((t,j)=>{ if(blanks.includes(j)){ const kk=k++, f=q.fills[kk]; const cls=q.done?(chips[f]===answers[kk]?'ok':'bad'):''; return `<button class="slot ${f!==null?'fill':''} ${cls}" data-act="o5un" data-k="${kk}" ${q.done?'disabled':''} aria-label="Kata hilang ${kk+1}">${f!==null?chips[f]:'؟'}</button>`; } return `<span>${t}</span>`; }).join(' ');
    el.innerHTML=`<div class="q-text">🔍 Temukan ${nb>1?'2 kata':'kata'} yang hilang!</div>
      <div class="mushaf"><span class="badge-n">${esc(v.sName)} · ayat ${v.n}</span><div class="ar ar-xl" lang="ar" dir="rtl">${line}</div></div>
      <div style="text-align:center">${listenBtn(v)}</div>
      <div class="tray">${chips.map((c,i)=>`<button class="chip-w ar ${q.fills.includes(i)?'used':''}" data-act="o5pick" data-i="${i}" ${q.done?'disabled':''}>${c}</button>`).join('')}</div>
      <div class="hint">${nb>1?'Isi dari kata hilang pertama (paling kanan). ':''}Ketuk kotak yang sudah terisi untuk mengganti.</div>`;
  };
  q.draw=draw; q.chips=chips; q.answers=answers; draw();
}

/* 6. Memory Card */
function r6(el,cfg,l){
  const pairs=[3,4,6][l-1], peek=[3.5,2.5,1.5][l-1];
  const ok=x=>x.words.length<=5&&x.id.length<=60;
  const chosen=[], seen=new Set();
  const src=[...shuffle(scopePool().filter(ok).filter(x=>!run.used.has(x.key))),...shuffle(scopePool().filter(ok)),...shuffle(VERSES.filter(ok))];
  for(const x of src){ if(chosen.length>=pairs) break; if(!seen.has(x.ar)&&!seen.has(x.id)&&!chosen.includes(x)){seen.add(x.ar);seen.add(x.id);chosen.push(x);} }
  chosen.forEach(x=>run.used.add(x.key));
  const cards=shuffle(chosen.flatMap(x=>[{m:x.key,type:'ar',html:`<span class="ar" lang="ar" dir="rtl">${x.ar}</span>`},{m:x.key,type:'id',html:esc(x.id)}]));
  const q=run.q={v:chosen,cards,first:null,lock:true,moves:0,matched:0,pairs};
  el.innerHTML=`<div class="q-text">Pasangkan ayat dengan artinya 🃏</div><div class="hint" id="mh">Perhatikan kartunya dulu…</div>
    <div class="mgrid n${pairs*2}">${cards.map((c,i)=>`<button class="mcard" data-act="flip" data-i="${i}" aria-label="Kartu ${i+1}"><span class="in"><span class="b">⭐</span><span class="f ${c.type==='ar'?'arf':''}">${c.html}</span></span></button>`).join('')}</div>
    <div class="hint">Langkah: <b id="mv">0</b> · target ${Math.ceil(pairs*2.2)} langkah atau kurang</div>`;
  later(()=>$$('.mcard').forEach(c=>c.classList.add('up')),350);
  later(()=>{ $$('.mcard').forEach(c=>c.classList.remove('up')); q.lock=false; const h=$('#mh'); if(h) h.textContent='Sekarang cari pasangannya!'; },350+peek*1000);
}
function flipCard(i){
  const q=run.q; if(!q||q.lock||run.locked) return;
  const cs=$$('.mcard'), c=cs[i]; if(c.classList.contains('up')||c.classList.contains('done')) return;
  c.classList.add('up'); sfx('tap');
  if(q.first===null){ q.first=i; return; }
  const a=q.first; q.first=null; q.moves++; $('#mv').textContent=q.moves;
  if(q.cards[a].m===q.cards[i].m){
    sfx('correct'); q.matched++; [cs[a],c].forEach(x=>x.classList.add('done'));
    if(q.matched===q.pairs){ const allowed=Math.ceil(q.pairs*2.2); later(()=>ans(q.moves<=allowed,q.v,`Kamu menyelesaikannya dalam ${q.moves} langkah (target ${allowed} atau kurang).`),700); }
  } else { q.lock=true; sfx('wrong'); later(()=>{ cs[a].classList.remove('up'); c.classList.remove('up'); q.lock=false; },950); }
}

/* 7. Susun Kata */
function r7(el,cfg,l){
  const f=l===1?x=>x.words.length>=3&&x.words.length<=4:l===2?x=>x.words.length>=5&&x.words.length<=7:x=>x.words.length>=6&&x.words.length<=14;
  const v=pickV(f), w=v.words;
  let items=shuffle(w.map((t,i)=>({t,i}))),tries=0; while(items.every((it,i)=>it.t===w[i])&&tries++<12) items=shuffle(w.map((t,i)=>({t,i})));
  const q=run.q={v,items,sel:[],done:null};
  const draw=()=>{
    el.innerHTML=`<div class="q-text">Susun kata-kata menjadi ayat yang benar 🧩</div>
      ${l<=2?`<div class="hint" style="font-size:.95rem">Artinya: “${esc(v.id)}”</div>`:`<div class="hint">Tanpa petunjuk arti. Ingat-ingat bacaannya!</div>`}
      <div style="text-align:center">${listenBtn(v)}</div>
      <div class="slotrow">${q.sel.length?q.sel.map((idx,pos)=>`<button class="chip-w ar ${q.done?(q.done[pos]?'ok':'bad'):''}" data-act="o7un" data-pos="${pos}" ${q.done?'disabled':''}>${items[idx].t}</button>`).join(''):'<span class="hint" style="direction:ltr">Ketuk kata di bawah, mulai dari kata pertama (paling kanan)</span>'}</div>
      <div class="tray">${items.map((it,idx)=>`<button class="chip-w ar ${q.sel.includes(idx)?'used':''}" data-act="o7pick" data-idx="${idx}" ${q.done?'disabled':''}>${it.t}</button>`).join('')}</div>
      <button class="btn btn-sun btn-block" data-act="o7chk" ${q.sel.length<items.length||q.done?'disabled':''}>Periksa susunan ✔</button>`;
  };
  q.draw=draw; draw();
}

/* 8. Tebak Arti */
function r8(el,cfg,l){
  const rev=l===3?true:(l===2?Math.random()<.5:false), v=pickV(), o=others(v);
  const key=rev?(x=>x.ar):(x=>x.id);
  const wrong=distract(key(v),cfg.opts-1,l===1?[o.scope,o.all]:[o.same,o.scope,o.all],key);
  const opts=shuffle([v,...wrong]);
  run.q={v,wrong:rev?'Ayat yang cocok dengan artinya ada di bawah ini.':'Arti yang tepat ada di bawah ini.'};
  el.innerHTML=`<div class="q-text">${rev?'Mana ayat yang artinya seperti ini?':'Apa arti ayat ini?'}</div>
    ${rev?`<div class="mushaf"><div style="font-weight:800;font-size:1.15rem;line-height:1.6;padding:6px 4px">“${esc(v.id)}”</div></div>`:`${mushaf(v.ar,{badge:`${v.sName} · ayat ${v.n}`})}<div style="text-align:center">${listenBtn(v)}</div>`}
    <div class="opts">${OPTS(opts.map(x=>({ok:x.key===v.key,cls:rev?'':'txt',html:rev?arSpan(x.ar):esc(x.id)})))}</div>`;
  if(cfg.timer) startTimer(cfg.timer);
}

/* 9. Dengar & Pilih */
function r9(el,cfg,l){
  const v=pickV(), o=others(v);
  const wrong=distract(v.ar,cfg.opts-1,l===1?[o.scope,o.all]:[o.same,o.scope,o.all],x=>x.ar);
  const opts=shuffle([v,...wrong]);
  run.q={v,wrong:'Ini ayat yang kamu dengar tadi.'};
  el.innerHTML=`<div class="q-text">Dengarkan baik-baik, lalu pilih ayat yang kamu dengar 🎧</div>
    <div style="text-align:center"><button class="btn btn-sun listen" style="font-size:1.3rem;padding:16px 28px" data-act="gplay" data-key="${v.key}">🔊 Putar suara</button><div class="hint" style="margin-top:8px">Boleh diputar berulang kali</div></div>
    <div class="opts">${OPTS(opts.map(x=>({ok:x.key===v.key,html:arSpan(x.ar)})))}</div>`;
  later(()=>{ if(!run.locked) playOnce(v).then(r=>{ if(r===false) audioFail(); }); },350);
  if(cfg.timer) startTimer(cfg.timer);
}

/* 10. Kata Menghilang (teknik hafalan bertahap) */
function r10(el,cfg,l){
  const f=l===1?x=>x.words.length>=3&&x.words.length<=6:l===2?x=>x.words.length>=4&&x.words.length<=8:x=>x.words.length>=6;
  const v=pickV(f), w=v.words, order=shuffle(w.map((_,i)=>i));
  const fr=[[.34,.67,1],[.25,.5,.75,1],[.5,.75,1]][l-1];
  const q=run.q={v,stage:-1,peek:new Set(),all:false};
  const draw=()=>{
    if(q.stage<0){
      el.innerHTML=`<div class="q-text">Tahap awal: baca & dengar 👂</div>${mushaf(v.ar,{badge:`${v.sName} · ayat ${v.n}`})}
        <div class="hint" style="font-size:.95rem">Artinya: “${esc(v.id)}”</div>
        <div style="text-align:center">${listenBtn(v)}</div>
        <div class="hint">Baca ayat ini keras-keras 3 kali bersama qari. Setelah itu, kata-katanya akan menghilang pelan-pelan!</div>
        <button class="btn btn-mint btn-block" data-act="g10go" style="max-width:420px;margin:0 auto">Aku siap, mulai hafalkan 🧠</button>`;
      return;
    }
    const n=Math.min(w.length,Math.max(1,Math.ceil(fr[q.stage]*w.length))), hidden=new Set(order.slice(0,n)), last=q.stage===fr.length-1;
    const line=w.map((t,j)=>hidden.has(j)&&!q.peek.has(j)&&!q.all?`<button class="ghost" data-act="g10peek" data-j="${j}" style="min-width:${Math.max(46,normAr(t).length*12)}px" aria-label="Kata tersembunyi. Ketuk untuk mengintip"></button>`:`<span ${hidden.has(j)&&!q.all?'style="color:#E8A200"':''}>${t}</span>`).join(' ');
    el.innerHTML=`<div class="q-text">Tahap ${q.stage+1} dari ${fr.length} · ${Math.round(n/w.length*100)}% kata disembunyikan</div>
      <div class="mushaf"><span class="badge-n">${esc(v.sName)} · ayat ${v.n}</span><div class="ar ar-xl" lang="ar" dir="rtl">${line}</div></div>
      <div style="text-align:center">${listenBtn(v)}</div>
      <div class="hint">${q.all?'Apakah bacaanmu tadi sudah benar semua?':'Ucapkan ayatnya dari ingatan. Ketuk kotak kosong kalau lupa.'}</div>
      ${q.all?`<div style="display:grid;gap:10px;max-width:520px;margin:0 auto;width:100%"><button class="btn btn-mint btn-block" data-act="selfok">Benar semua ✅</button><button class="btn btn-ghost btn-block" data-act="selfno">Masih ada yang salah 🔁</button></div>`
        :last?`<button class="btn btn-sun btn-block" data-act="g10check" style="max-width:420px;margin:0 auto">Cek ayatku 👀</button>`
        :`<button class="btn btn-sun btn-block" data-act="g10next" style="max-width:420px;margin:0 auto">Lanjut, lebih sulit ➡️</button>`}`;
  };
  q.draw=draw; draw();
}

/* ---------- daftar game ---------- */
const GAMES=[
 {id:1,emoji:'❓',name:'Tebak Surah',short:'Ayat ini dari surah apa? Baca, dengar, lalu tebak!',how:'Lihat atau dengarkan potongan ayat, lalu pilih nama surahnya.',render:r1,
  levels:[{q:5,opts:3,desc:'5 soal · 3 pilihan · boleh dengar audio'},{q:7,opts:4,desc:'7 soal · 4 pilihan'},{q:10,opts:4,timer:15,desc:'10 soal · 4 pilihan · 15 detik tiap soal'}]},
 {id:2,emoji:'🔗',name:'Sambung Ayat',short:'Lanjutkan potongan ayat atau tebak ayat berikutnya.',how:'Pilih sambungan yang tepat. Di Level 3 kamu menebak ayat yang datang setelahnya.',render:r2,
  levels:[{q:5,opts:3,desc:'5 soal · sambung kata · petunjuk banyak'},{q:7,opts:4,desc:'7 soal · sambung kata · petunjuk sedikit'},{q:10,opts:4,timer:25,desc:'10 soal · tebak ayat berikutnya · 25 detik'}]},
 {id:3,emoji:'🔢',name:'Urutkan Ayat',short:'Susun ayat-ayat acak menjadi urutan yang benar.',how:'Ketuk ayat satu per satu mulai dari ayat yang pertama.',render:r3,
  levels:[{q:3,desc:'3 soal · urutkan 3 ayat'},{q:4,desc:'4 soal · urutkan 4 ayat'},{q:5,desc:'5 soal · urutkan 5 ayat'}]},
 {id:4,emoji:'🎤',name:'Bacakan Ayat',short:'Baca dengan suaramu, mikrofon ikut mendengarkan.',how:'Dengarkan contoh qari, lalu bacakan ayatnya. Di Level 3 ayat disamarkan.',render:r4,
  levels:[{q:3,desc:'3 ayat pendek · ayat terlihat'},{q:4,desc:'4 ayat sedang · ayat terlihat'},{q:5,desc:'5 ayat · ayat disamarkan, baca dari ingatan'}]},
 {id:5,emoji:'🕵️',name:'Detektif Kata',short:'Temukan kata yang hilang di dalam ayat.',how:'Ketuk kata yang tepat untuk mengisi kotak yang hilang.',render:r5,
  levels:[{q:5,opts:3,desc:'5 soal · 1 kata hilang · 3 pilihan'},{q:7,opts:4,desc:'7 soal · 1 kata hilang · 4 pilihan mirip'},{q:8,opts:5,desc:'8 soal · 2 kata hilang · 5 pilihan'}]},
 {id:6,emoji:'🃏',name:'Kartu Ingatan',short:'Balik kartu, pasangkan ayat dengan artinya.',how:'Ingat posisi kartu, lalu cocokkan ayat Arab dengan terjemahannya.',render:r6,
  levels:[{q:2,desc:'2 ronde · 3 pasang kartu · intip lama'},{q:2,desc:'2 ronde · 4 pasang kartu'},{q:2,desc:'2 ronde · 6 pasang kartu · intip sebentar'}]},
 {id:7,emoji:'🧩',name:'Susun Kata',short:'Rangkai kata-kata acak menjadi ayat utuh.',how:'Ketuk kata-kata sesuai urutan bacaan, mulai dari kata pertama.',render:r7,
  levels:[{q:4,desc:'4 soal · ayat 3-4 kata · ada arti'},{q:5,desc:'5 soal · ayat 5-7 kata · ada arti'},{q:6,desc:'6 soal · ayat panjang · tanpa arti'}]},
 {id:8,emoji:'💡',name:'Tebak Arti',short:'Pahami makna ayat supaya hafalan makin kuat.',how:'Pilih arti yang cocok dengan ayat, atau ayat yang cocok dengan arti.',render:r8,
  levels:[{q:5,opts:3,desc:'5 soal · pilih arti · 3 pilihan'},{q:7,opts:4,desc:'7 soal · arti dan ayat bergantian · 4 pilihan'},{q:10,opts:4,timer:20,desc:'10 soal · pilih ayat dari arti · 20 detik'}]},
 {id:9,emoji:'🎧',name:'Dengar & Pilih',short:'Dengarkan qari, lalu pilih ayat yang dibaca.',how:'Putar suara, simak baik-baik, lalu pilih tulisan ayat yang sama.',render:r9,
  levels:[{q:5,opts:3,desc:'5 soal · 3 pilihan'},{q:7,opts:4,desc:'7 soal · 4 pilihan yang mirip'},{q:10,opts:4,timer:30,desc:'10 soal · 4 pilihan · 30 detik'}]},
 {id:10,emoji:'🪄',name:'Kata Menghilang',short:'Kata-kata lenyap bertahap sampai kamu hafal.',how:'Baca bersama qari. Tiap tahap, makin banyak kata yang menghilang. Ucapkan dari ingatan!',render:r10,
  levels:[{q:3,desc:'3 ayat · 3 tahap'},{q:4,desc:'4 ayat · 4 tahap'},{q:5,desc:'5 ayat panjang · separuh kata hilang sejak awal'}]}
];

/* ---------- aksi game ---------- */
Object.assign(ACTIONS,{
  start:t=>startRun(+t.dataset.g,+t.dataset.l),
  quit:()=>{ if(!run||run.locked||confirm('Keluar dari permainan? Skor ronde ini tidak disimpan.')) nav('home'); },
  next:()=>{ run.idx++; nextQ(); },
  gplay:async t=>{ const v=vById(t.dataset.key); const r=await playOnce(v); if(r===false) audioFail(); },
  opt:t=>{ if(run.locked) return; const ok=t.dataset.ok==='1'; markOptions(t); ans(ok,run.q.v,ok?'':(run.q.wrong||'')); },
  /* 3 */
  o3pick:t=>{ const q=run.q; if(run.locked||q.done) return; const i=+t.dataset.idx; if(q.sel.includes(i)) return; q.sel.push(i); sfx('tap'); q.draw(); },
  o3un:t=>{ const q=run.q; if(run.locked||q.done) return; q.sel.splice(+t.dataset.pos,1); q.draw(); },
  o3chk:()=>{ const q=run.q; if(run.locked||q.sel.length<q.items.length) return;
    q.done=q.sel.map((idx,pos)=>q.items[idx].ar===q.v[pos].ar); q.draw();
    const ok=q.done.every(Boolean); ans(ok,q.v,ok?'':'Urutan yang benar ada di bawah ini. Dengarkan dan ulangi ya!'); },
  /* 4 + 10 */
  mic:()=>startMic(),
  peek:()=>{ const m=$('#mus .mushaf'); if(m) m.classList.remove('blur'); },
  selfok:()=>ans(true,run.q.v,'Hebat! Terus ulangi supaya makin kuat hafalannya.'),
  selfno:()=>ans(false,run.q.v,'Tidak apa-apa. Dengarkan lagi bersama qari, lalu ulangi sampai lancar.'),
  g10go:()=>{ run.q.stage=0; run.q.peek=new Set(); run.q.draw(); },
  g10peek:t=>{ run.q.peek.add(+t.dataset.j); sfx('tap'); run.q.draw(); },
  g10next:()=>{ run.q.stage++; run.q.peek=new Set(); sfx('star'); run.q.draw(); },
  g10check:()=>{ run.q.all=true; run.q.draw(); },
  /* 5 */
  o5pick:t=>{ const q=run.q; if(run.locked||q.done) return; const i=+t.dataset.i, k=q.fills.indexOf(null); if(k<0||q.fills.includes(i)) return; q.fills[k]=i; sfx('tap');
    if(q.fills.every(x=>x!==null)){ q.done=true; q.draw(); const ok=q.fills.every((ci,kk)=>q.chips[ci]===q.answers[kk]); ans(ok,q.v,ok?'':`Kata yang hilang: ${q.answers.map(a=>arSpan(a)).join(' ، ')}`); } else q.draw(); },
  o5un:t=>{ const q=run.q; if(run.locked||q.done) return; q.fills[+t.dataset.k]=null; q.draw(); },
  /* 6 */
  flip:t=>flipCard(+t.dataset.i),
  /* 7 */
  o7pick:t=>{ const q=run.q; if(run.locked||q.done) return; const i=+t.dataset.idx; if(q.sel.includes(i)) return; q.sel.push(i); sfx('tap'); q.draw(); },
  o7un:t=>{ const q=run.q; if(run.locked||q.done) return; q.sel.splice(+t.dataset.pos,1); q.draw(); },
  o7chk:()=>{ const q=run.q; if(run.locked||q.sel.length<q.items.length) return; const w=q.v.words;
    q.done=q.sel.map((idx,pos)=>q.items[idx].t===w[pos]); q.draw();
    const ok=q.done.every(Boolean); ans(ok,q.v,ok?'':'Susunan yang benar ada di bawah ini. Coba baca bersama qari ya!'); }
});
